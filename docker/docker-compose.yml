# =====================================================================
# 奶茶点单系统 · 本地部署编排
#
# 拓扑：MySQL 与 MinIO 部署在远端服务器（地址由 backend/.env 提供，模板见 backend/.env.example），
#       本地运行 backend + admin-web 两个容器；后端启动后经远端地址直连 DB / 对象存储，
#       前端 nginx 直接读取静态产物，并把 /api 反代到 backend 容器（同源方案，无需配 CORS）。
#
# 用法：
#   cd docker
#   docker compose up -d --build        # 默认起 backend + admin-web
#   curl http://127.0.0.1:8080/actuator/health          # 后端健康
#   curl -I http://127.0.0.1:8081/                     # 前端首页
#   # 只起后端：docker compose up -d --build backend
#   # 公网暴露：本机装 cpolar，隧道指向 8081（前端）即可，/api 由 nginx 内部转发
#
# 说明：mysql / minio 两个服务是「本地自建基础设施」的备份定义，默认不启动；
#       仅当需要在本机起基础设施时用：docker compose --profile infra up -d
# =====================================================================
services:
  # -------------------------------------------------------------------
  # 本地后端：连远端 MySQL / MinIO（由 backend/.env 注入，缺失时回落 localhost 默认值）
  # -------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: milktea-backend:latest
    container_name: demo-backend
    restart: unless-stopped
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      # 与后端业务时区一致（订单号 yyMMdd / 取餐码自然日重置基准）
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # -------------------------------------------------------------------
  # 管理后台前端：nginx 静态托管 + /api 反代（反代目标写死为 http://backend:8080，
  # 即下方 service 名；改服务名会直接让 nginx 启动时解析失败）
  # -------------------------------------------------------------------
  admin-web:
    build:
      context: ../admin-web
      dockerfile: Dockerfile
    image: milktea-admin-web:latest
    container_name: demo-admin-web
    restart: unless-stopped
    # nginx 在启动阶段静态解析 proxy_pass 的主机名，解析不到就退出，
    # 故必须等 backend 就绪（而非仅创建容器）后再起
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # 宿主机 8081 → 容器 80；80 被占用时改这里即可，前端 /api 路径不受影响
      - "8081:80"
    # 健康检查已在 admin-web/Dockerfile 内用 HEALTHCHECK 声明，此处不重复定义

  # -------------------------------------------------------------------
  # 以下为「本地自建基础设施」备份定义，默认不启动（仅 --profile infra 时启用）
  # -------------------------------------------------------------------
  mysql:
    profiles: ["infra"]
    image: mysql:8.0                # 建议钉在 8.0 系列；mysql:8 会漂到 8.4，行为略有差异
    container_name: demo-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 应用库 / 专用账号：与 LLD 对齐（此处沿用文档示例库名 demo_db）
      MYSQL_DATABASE: demo_db
      # MYSQL_USER: demo
      # MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s            # 首次建库慢，给足宽限期
  minio:
    profiles: ["infra"]
    image: minio/minio:latest
    container_name: demo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"                # S3 API
      - "9001:9001"                # Web 控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  mysql-data:
  minio-data:
