# =====================================================================
# 奶茶点单系统 · 本地部署编排
#
# 拓扑：MySQL 与 MinIO 部署在远端服务器（地址见 backend/src/main/resources/application-dev.yml），
#       本地只需运行 backend 容器；容器启动后经远端地址直连 DB / 对象存储。
#
# 用法：
#   cd docker
#   docker compose up -d --build        # 默认只起 backend
#   curl http://127.0.0.1:8080/actuator/health
#   # 公网暴露：本机装 cpolar，隧道指向 8080 → HTTPS 域名
#
# 说明：mysql / minio 两个服务是「本地自建基础设施」的备份定义，默认不启动；
#       仅当需要在本机起基础设施时用：docker compose --profile infra up -d
# =====================================================================
services:
  # -------------------------------------------------------------------
  # 本地后端：连远端 MySQL / MinIO（由 application-dev.yml 指定，无需在此覆盖）
  # -------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: milktea-backend:latest
    container_name: demo-backend
    restart: unless-stopped
    environment:
      # 与后端业务时区一致（订单号 yyMMdd / 取餐码自然日重置基准）
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # -------------------------------------------------------------------
  # 以下为「本地自建基础设施」备份定义，默认不启动（仅 --profile infra 时启用）
  # -------------------------------------------------------------------
  mysql:
    profiles: ["infra"]
    image: mysql:8.0                # 建议钉在 8.0 系列；mysql:8 会漂到 8.4，行为略有差异
    container_name: demo-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 应用库 / 专用账号：与 LLD 对齐（此处沿用文档示例库名 demo_db）
      MYSQL_DATABASE: demo_db
      # MYSQL_USER: demo
      # MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s            # 首次建库慢，给足宽限期
  minio:
    profiles: ["infra"]
    image: minio/minio:latest
    container_name: demo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"                # S3 API
      - "9001:9001"                # Web 控制台
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  mysql-data:
  minio-data:
