# 单店奶茶点单系统 · 持续集成流水线
#
# 三端并行校验，每个 job 都按「依赖安装 → 代码检查 → 单元测试 → 构建验证」推进：
#   backend      Spring Boot 4 / Maven / JDK 25（含 MySQL 8.0 服务容器，覆盖 Flyway 迁移与 @SpringBootTest）
#   admin-web    Vue 3 / Vite 8 / TypeScript
#   miniprogram  uni-app（微信小程序构建产物）
#
# 三端全绿后，再由 docker-backend / docker-admin-web 两个 job 接力构建并推送镜像到 GHCR，
# 只在 main 上执行（原先独立的 test-build.yml 已合并进来：那个 workflow 没有门禁，
# 类型检查挂了也会把镜像推上 latest）。
#
# 后端 application-dev.yml 默认连开发机的外网库，CI 通过环境变量把数据源指向本次运行的
# MySQL 服务容器，使流水线自包含、不依赖任何外部环境。

name: CI

on:
  # 主干与长期分支的提交
  push:
    branches: [main, cph, dsh]
  # 任意目标分支的 PR
  pull_request:
  # 支持手动重跑，便于排查偶发失败
  workflow_dispatch:

# 最小权限：校验类 job 只读取仓库内容；推镜像所需的 packages: write 单独授予两个 docker-* job
permissions:
  contents: read

# 同一分支仅保留最新一次运行：推入新提交时取消尚未完成的旧任务
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---------------------------------------------------------------------------
  # 后端：编译检查 → 单元测试 → 打包验证
  # ---------------------------------------------------------------------------
  backend:
    name: backend · JDK 25 / Maven
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # 后端单测全部自包含，无需外部 MySQL：
    #   · PricingServiceTest 用 Mockito，无数据库；
    #   · SequenceServiceTest 用内存 H2（MODE=MySQL），数据源在测试内钉死。
    # 故不再启动 MySQL 服务容器，流水线更快、自包含。
    # 若后续新增依赖真实库的集成测试，恢复 services.mysql 并用下方 env 覆盖数据源：
    #   SPRING_DATASOURCE_URL: "jdbc:mysql://127.0.0.1:3306/milk_tea?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
    #   SPRING_DATASOURCE_USERNAME: root
    #   SPRING_DATASOURCE_PASSWORD: root

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven # 缓存 ~/.m2/repository

      - name: 准备 Maven Wrapper
        working-directory: backend
        run: chmod +x ./mvnw # 仓库中 mvnw 未带可执行位，Linux 上需补上

      - name: 依赖安装与代码检查（编译）
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests compile

      - name: 单元测试
        working-directory: backend
        run: ./mvnw -B -ntp test

      - name: 构建验证（打包可运行 jar）
        working-directory: backend
        run: ./mvnw -B -ntp -DskipTests package

      - name: 上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/*.jar
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 管理后台：类型检查 → 单元测试 → 生产构建
  # ---------------------------------------------------------------------------
  admin-web:
    name: admin-web · Vue 3 / Vite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: admin-web

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 代码检查（TypeScript 类型）
        run: npm run type-check

      # 仓库尚未接入前端测试框架；--if-present 保证管线不因此失败，后续补齐 Vitest 后自动生效
      - name: 单元测试
        run: npm test --if-present

      - name: 构建验证
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-dist
          path: admin-web/dist/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 小程序：依赖安装 → 微信小程序构建（uni-app 编译期即可暴露类型与资源错误）
  # ---------------------------------------------------------------------------
  miniprogram:
    name: miniprogram · uni-app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: miniprogram

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: miniprogram/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 代码检查（TypeScript 类型）
        run: npm run type-check

      # 仓库尚未接入前端测试框架；--if-present 保证管线不因此失败，后续补齐 Vitest 后自动生效
      - name: 单元测试
        run: npm test --if-present

      - name: 构建验证（微信小程序）
        run: npm run build:mp-weixin

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: miniprogram-dist
          path: miniprogram/dist/build/mp-weixin/
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 镜像发布：三端全部跑绿才推（needs 是硬依赖，任一端失败则两个发布 job 不执行）
  #
  # 只在 main 上执行；PR 或其他分支的 run 会显示为 skipped，不浪费 runner。
  # 两个发布 job 彼此无依赖，默认并行；若只有一个成功，那一轮前后端镜像不成对，
  # 按 sha 标签部署前需到两个包里分别确认该标签存在。
  # ---------------------------------------------------------------------------
  docker-backend:
    name: docker · 后端镜像发布
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, admin-web, miniprogram]
    # 仅主干：避开 push 触发列表里的 cph / dsh 也来抢 latest 标签
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cexpp/milkteastore
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,scope=backend-image,mode=max

  docker-admin-web:
    name: docker · 后台前端镜像发布
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, admin-web, miniprogram]
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/cexpp/milkteastore-admin-web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 标签策略与后端一致，一次 push 出的两个镜像能用同一个 sha-xxxxxxx 成对部署
      - name: 提取镜像元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=branch

      - name: 配置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=admin-web-image
          cache-to: type=gha,scope=admin-web-image,mode=max
