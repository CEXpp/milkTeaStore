# 本地联调：MySQL / MinIO 地址与密钥从 backend/.env 读取（该文件不入库）；
# 未提供 .env 时全部回落到 localhost 默认值（配合 docker compose --profile infra 本地自建）
spring:
  config:
    import:
      - optional:file:backend/.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true 必须加：MySQL 8 默认 caching_sha2_password，
    # JDBC 非 SSL 连接时不加会报 Public Key Retrieval is not allowed
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/milk_tea?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DEV_DB_USERNAME:root}
    password: ${DEV_DB_PASSWORD:1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminUsername: ${admin.initial-username}
      adminPasswordHash: ${admin.initial-password-hash}
  servlet:
    multipart:
      # 图片上传上限（T08）：单文件/单请求均 2MB，与 MinioFileStorageService.MAX_SIZE 双重校验
      max-file-size: 2MB
      max-request-size: 2MB
# MyBatis-Plus：表结构仍由 Flyway 管，这里只做映射配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
# minio.* 的层级结构按项目配置类 / LLD 定义对齐，URL 参数同理
# 注意：endpoint 必须是 S3 对象存储 API 端口（9000），9001 为 Web 控制台端口，不可用于 SDK 连接
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:12345678}
  bucket: ${MINIO_BUCKET:dev-bucket}
# Actuator：暴露生产端点（T04）。默认即暴露 health，此处显式声明
management:
  endpoints:
    web:
      exposure:
        include: health
# 微信小程序（T05）：appid/secret 全部走配置，不硬编码；生产建议用环境变量 WX_SECRET 注入
# appid 取自 manifest.json（wxcd3beb616feadd06）；secret 为小程序「开发管理-开发设置」中的 AppSecret
wx:
  appid: "wxcd3beb616feadd06"
  secret: "${WX_SECRET:}"   # 本地联调用 dev-login 通道即可；真实 wx.login 需在此填入 AppSecret（或注入环境变量 WX_SECRET）
  # 订阅消息推送（T44）：默认关闭。未配置模板 ID 时前端不弹授权、后端不下发（SRS 9.3 降级），
  # 关闭状态下全链路静默短路，不影响下单/支付/取餐任何主流程。
  # 开通步骤：公众平台「功能-订阅消息」选用模板 → 填模板 ID 与各变量名 → enabled 置 true，
  # 并在 backend/.env 注入 WX_SECRET（下发需 AppSecret）。
  # 注意：微信侧需把服务端出口 IP 加入白名单，否则换取 access_token 会返回 errcode=40164。
  # 变量名（thing1 / character_string2 / time3）必须与该模板实际关键词一致，留空表示不下发该字段。
  subscribe:
    enabled: ${WX_SUBSCRIBE_ENABLED:false}
    # 点击消息跳转页（限本小程序内页面，服务端会自动追加 ?id=订单号）
    page: pages/order-detail/index
    # 跳转的小程序版本：developer 开发版 / trial 体验版 / formal 正式版
    miniprogram-state: ${WX_SUBSCRIBE_STATE:developer}
    # 制作开始（PREPARING）
    preparing:
      template-id: "${WX_TMPL_PREPARING:}"
      status-key: thing1
      pickup-code-key: character_string2
      time-key: time3
    # 取餐提醒（COMPLETED，由 PICKUP_READY 事件触发）
    pickup:
      template-id: "${WX_TMPL_PICKUP:}"
      status-key: thing1
      pickup-code-key: character_string2
      time-key: time3
    # 稍后提醒我再点（T47，结算页下单前预期管理）：无订单上下文，故不需要取餐码变量
    remind:
      template-id: "${WX_TMPL_REMIND:}"
      status-key: thing1
      time-key: time3
# JWT（T06）：HS256 密钥，长度须 ≥ 32 字节；真实密钥放 backend/.env（JWT_SECRET），默认值仅为本地占位
jwt:
  secret: "${JWT_SECRET:dev-only-insecure-jwt-secret-please-change-me-0123456789abcdef}"
  customer-expire-days: 7
  admin-expire-hours: 12
# 初始商家账号（单账号）：供 Flyway V2 种子数据写入 admin_user（BCrypt 哈希）
# 默认 dev 凭据 username=admin / password=admin123；生产请改为环境变量注入
admin:
  initial-username: admin
  initial-password-hash: "$2a$10$0wPAHfMp1O5Y/lKPcp6mJ.O1bIDStGAZyKyMsUrQU7QwEc3jRwX8C"
# 支付域（T12）：激活的支付渠道，取值对应 PaymentProvider.channel()（匹配不区分大小写）。
# 练手期 mock；真店期新增 WechatPaymentProvider 实现后改为 wechat 即可，调用方代码零改动（LLD 5.1）
payment:
  active-channel: mock
# 业务时区：订单号 yyMMdd 前缀与取餐码「自然日重置」的基准，须与门店所在地一致
app:
  time-zone: Asia/Shanghai
  # 跨域配置：允许的前端来源（逗号分隔）；未配置时默认放行全部（仅本地联调用）
  cors:
    allowed-origins: "*"
# 订单（T10）：支付期限（分钟），下单响应 expireAt = createdAt + 该值（LLD 3.3 / 4.2）
order:
  payment-timeout-minutes: 15
  # 稍后提醒（T47）：结算页「稍后提醒我再点」的默认延迟（分钟）；请求可指定，服务端上限 60
  remind-delay-minutes: ${ORDER_REMIND_DELAY_MINUTES:15}
# 队列预估内核（T46，LLD 11.6）：下列为默认值，可被 shop_config（KV 表）按运行期覆盖——
# 覆盖键为 queue.prep-minutes / queue.staff / queue.volatility（见 QueueEstimateService）；
# buffer-minutes 按 LLD 定位为「常量安全垫」，不开放运行期覆盖。
queue:
  # 单杯基准耗时 t_unit（分钟，任务卡「单杯基准耗时」）
  prep-minutes: ${QUEUE_PREP_MINUTES:3}
  # 在岗制作单元数 s（≥1）
  staff: ${QUEUE_STAFF:1}
  # 历史波动系数 k（T69 爆单预测可校准）
  volatility: ${QUEUE_VOLATILITY:0.3}
  # 误差常量安全垫 buffer（分钟）
  buffer-minutes: ${QUEUE_BUFFER_MINUTES:1}
  # 动态接单节奏（T48，W18）：队列杯数阈值。达到 busy 在看板提示偏忙；
  # 达到 overload 仅「建议」暂停接单——系统不会自动暂停，暂停始终由店长在顶栏开关手动作出。
  pace:
    busy-cups: ${QUEUE_PACE_BUSY_CUPS:10}
    overload-cups: ${QUEUE_PACE_OVERLOAD_CUPS:20}
# AI 点单（T29）：三件套全配置化，换豆包等 OpenAI 兼容模型只改此处，代码零改动（LLD 6.2）
ai:
  # GLM 的 OpenAI 兼容端点（LLD 6.2）
  base-url: https://open.bigmodel.cn/api/paas/v4
  # 密钥一律走 backend/.env 或环境变量 AI_API_KEY，不入库不入前端；缺省时 AI 点单功能不可用
  api-key: "${AI_API_KEY:}"
  model: glm-4-flash
  temperature: 0.2
  # 单次响应超时（秒）：SRS 5.5「模型单次响应超过 10 秒视为超时」
  # 注：LLD 6.2 写作 20 秒，与 SRS 5.5 冲突，本任务按需求基线取 10（见 docs/T29-AI基础设施实施方案.md 冲突 C4）
  timeout-seconds: 10
  # 记忆窗口消息数：20 条 ≈ 10 轮问答（T29 卡 / HLD「10 轮记忆」）
  max-messages: 20
  # 会话无活动过期时长（分钟）：LLD 6.5 / HLD
  session-timeout-minutes: 30
  # 按顾客限流（T31，LLD 9.2「chat 接口按顾客维度限流 10 次/分钟，内存滑动窗口」）：
  # 超出返回 code=1009，保护免费档模型额度（HLD 风险 R2）
  rate-limit-per-minute: 10
