# 本地联调：MySQL / MinIO 跑在 Linux 虚拟机的 Docker 容器里，host 填虚拟机 IP（不是 localhost）
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true 必须加：MySQL 8 默认 caching_sha2_password，
    # JDBC 非 SSL 连接时不加会报 Public Key Retrieval is not allowed
    url: jdbc:mysql://192.168.30.101:3307/demo_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate   # 建议用 validate/none，表结构交给 Flyway 管，别让 JPA 和 Flyway 打架
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminUsername: ${admin.initial-username}
      adminPasswordHash: ${admin.initial-password-hash}
# minio.* 的层级结构按项目配置类 / LLD 定义对齐，URL 参数同理
minio:
  endpoint: http://192.168.30.101:9000
  access-key: root
  secret-key: 12345678
  bucket: dev-bucket
