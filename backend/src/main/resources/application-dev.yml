# 本地联调：MySQL / MinIO 地址与密钥从 backend/.env 读取（该文件不入库）；
# 未提供 .env 时全部回落到 localhost 默认值（配合 docker compose --profile infra 本地自建）
spring:
  config:
    import:
      # 两条候选路径是刻意的：`spring.config.import` 的 file: 是**相对工作目录**的，
      # 而 spring-boot-maven-plugin 的 workingDirectory 默认是 ${project.basedir}（即 backend/）。
      # 于是只写 file:backend/.env 时，从 backend/ 启动会去找 backend/backend/.env ——
      # 因为标了 optional 便静默跳过，悄悄回落到下面的 localhost 默认值，
      # 最终表现为「数据库连不上 / Access denied for root@localhost」而看不出是配置没加载。
      - optional:file:backend/.env[.properties]
      - optional:file:.env[.properties]
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # allowPublicKeyRetrieval=true 必须加：MySQL 8 默认 caching_sha2_password，
    # JDBC 非 SSL 连接时不加会报 Public Key Retrieval is not allowed
    url: ${DEV_DB_URL:jdbc:mysql://localhost:3306/milk_tea?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
    username: ${DEV_DB_USERNAME:root}
    password: ${DEV_DB_PASSWORD:1234}
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      adminUsername: ${admin.initial-username}
      adminPasswordHash: ${admin.initial-password-hash}
  servlet:
    multipart:
      # 图片上传上限（T08）：单文件/单请求均 2MB，与 MinioFileStorageService.MAX_SIZE 双重校验
      max-file-size: 2MB
      max-request-size: 2MB
# MyBatis-Plus：表结构仍由 Flyway 管，这里只做映射配置
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
# minio.* 的层级结构按项目配置类 / LLD 定义对齐，URL 参数同理
# 注意：endpoint 必须是 S3 对象存储 API 端口（9000），9001 为 Web 控制台端口，不可用于 SDK 连接
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:root}
  secret-key: ${MINIO_SECRET_KEY:12345678}
  bucket: ${MINIO_BUCKET:dev-bucket}
# Actuator：暴露生产端点（T04）。默认即暴露 health，此处显式声明
management:
  endpoints:
    web:
      exposure:
        include: health
# 微信小程序（T05）：appid/secret 全部走配置，不硬编码；生产建议用环境变量 WX_SECRET 注入
# appid 取自 manifest.json（wxcd3beb616feadd06）；secret 为小程序「开发管理-开发设置」中的 AppSecret
wx:
  appid: ${APP_ID}
  secret: "${WX_SECRET:}"   # 本地联调用 dev-login 通道即可；真实 wx.login 需在此填入 AppSecret（或注入环境变量 WX_SECRET）
  # 订阅消息推送（T44）：默认关闭。未配置模板 ID 时前端不弹授权、后端不下发（SRS 9.3 降级），
  # 关闭状态下全链路静默短路，不影响下单/支付/取餐任何主流程。
  # 开通步骤：公众平台「功能-订阅消息」选用模板 → 填模板 ID 与各变量名 → enabled 置 true，
  # 并在 backend/.env 注入 WX_SECRET（下发需 AppSecret）。
  # 注意：微信侧需把服务端出口 IP 加入白名单，否则换取 access_token 会返回 errcode=40164。
  # 变量名（thing1 / character_string2 / time3）必须与该模板实际关键词一致，留空表示不下发该字段。
  subscribe:
    enabled: ${WX_SUBSCRIBE_ENABLED:false}
    # 点击消息跳转页（限本小程序内页面，服务端会自动追加 ?id=订单号）
    page: pages/order-detail/index
    # 跳转的小程序版本：developer 开发版 / trial 体验版 / formal 正式版
    miniprogram-state: ${WX_SUBSCRIBE_STATE:developer}
    # 制作开始（PREPARING）
    preparing:
      template-id: "${WX_TMPL_PREPARING:}"
      status-key: thing1
      pickup-code-key: character_string2
      time-key: time3
    # 取餐提醒（COMPLETED，由 PICKUP_READY 事件触发）
    pickup:
      template-id: "${WX_TMPL_PICKUP:}"
      status-key: thing1
      pickup-code-key: character_string2
      time-key: time3
    # 稍后提醒我再点（T47，结算页下单前预期管理）：无订单上下文，故不需要取餐码变量
    remind:
      template-id: "${WX_TMPL_REMIND:}"
      status-key: thing1
      time-key: time3
# JWT（T06）：HS256 密钥，长度须 ≥ 32 字节；真实密钥放 backend/.env（JWT_SECRET），默认值仅为本地占位
jwt:
  secret: "${JWT_SECRET:dev-only-insecure-jwt-secret-please-change-me-0123456789abcdef}"
  customer-expire-days: 7
  admin-expire-hours: 12
# 初始商家账号（单账号）：供 Flyway V2 种子数据写入 admin_user（BCrypt 哈希）
# 默认 dev 凭据 username=admin / password=admin123；生产请改为环境变量注入
admin:
  initial-username: admin
  initial-password-hash: "$2a$10$0wPAHfMp1O5Y/lKPcp6mJ.O1bIDStGAZyKyMsUrQU7QwEc3jRwX8C"
# 支付域（T12）：激活的支付渠道，取值对应 PaymentProvider.channel()（匹配不区分大小写）。
# 练手期 mock；真店期新增 WechatPaymentProvider 实现后改为 wechat 即可，调用方代码零改动（LLD 5.1）
payment:
  active-channel: mock
# 业务时区：订单号 yyMMdd 前缀与取餐码「自然日重置」的基准，须与门店所在地一致
app:
  time-zone: Asia/Shanghai
  # 跨域配置：允许的前端来源（逗号分隔）；未配置时默认放行全部（仅本地联调用）
  cors:
    allowed-origins: "*"
# 订单（T10）：支付期限（分钟），下单响应 expireAt = createdAt + 该值（LLD 3.3 / 4.2）
order:
  payment-timeout-minutes: 15
  # 稍后提醒（T47）：结算页「稍后提醒我再点」的默认延迟（分钟）；请求可指定，服务端上限 60
  remind-delay-minutes: ${ORDER_REMIND_DELAY_MINUTES:15}
# 队列预估内核（T46，LLD 11.6）：下列为默认值，可被 shop_config（KV 表）按运行期覆盖——
# 覆盖键为 queue.prep-minutes / queue.staff / queue.volatility（见 QueueEstimateService）；
# buffer-minutes 按 LLD 定位为「常量安全垫」，不开放运行期覆盖。
queue:
  # 单杯基准耗时 t_unit（分钟，任务卡「单杯基准耗时」）
  prep-minutes: ${QUEUE_PREP_MINUTES:3}
  # 在岗制作单元数 s（≥1）
  staff: ${QUEUE_STAFF:1}
  # 历史波动系数 k（T69 爆单预测可校准）
  volatility: ${QUEUE_VOLATILITY:0.3}
  # 误差常量安全垫 buffer（分钟）
  buffer-minutes: ${QUEUE_BUFFER_MINUTES:1}
  # 动态接单节奏（T48，W18）：队列杯数阈值。达到 busy 在看板提示偏忙；
  # 达到 overload 仅「建议」暂停接单——系统不会自动暂停，暂停始终由店长在顶栏开关手动作出。
  pace:
    busy-cups: ${QUEUE_PACE_BUSY_CUPS:10}
    overload-cups: ${QUEUE_PACE_OVERLOAD_CUPS:20}
# 每日经营日报（T68，W08）：打烊后自动生成口语化日报 + 异常预警。
# 阈值全部可配；**取 0 或负数表示关闭该条检测**（不想被提醒就应该能关掉）。
# 异常判定是确定性的（先按阈值算完、再让 AI 讲人话），故这些阈值直接决定「什么算异常」。
report:
  # 打烊生成时刻（0-23），默认 22 点
  closing-hour: ${REPORT_CLOSING_HOUR:22}
  # 营业额较近 7 日同期均值下降超过该百分比即报异常
  revenue-drop-percent: ${REPORT_REVENUE_DROP:30}
  # 退款率（退款额 / 未扣退款前的实付总额）超过该百分比即报异常
  refund-ratio-percent: ${REPORT_REFUND_RATIO:10}
  # 某渠道单量占比相对近 7 日同期下降超过该百分点即报异常
  channel-drop-points: ${REPORT_CHANNEL_DROP:20}
# 爆单预测与备料建议（T69，W09）：预测**只给建议，绝不自动执行**——
# 不自动开暂停接单、不自动改价、不自动上下架；建议权在系统，决定权在人。
# 阈值取 0 或负数即关闭该级提示；enabled=false 则整个预测停用（与「算了但正常」可区分）。
forecast:
  enabled: ${FORECAST_ENABLED:true}
  # 预测窗口（分钟），默认 15
  window-minutes: ${FORECAST_WINDOW_MINUTES:15}
  # 同星期样本窗口（周），默认 4
  lookback-weeks: ${FORECAST_LOOKBACK_WEEKS:4}
  # 同星期样本不足该天数时，改用「近 14 天同时段」口径
  min-sample-days: ${FORECAST_MIN_SAMPLE_DAYS:2}
  # 预测单量达到该值 → 偏忙，建议提前备料（≤0 关闭该级）
  busy-orders: ${FORECAST_BUSY_ORDERS:5}
  # 预测单量达到该值 → 可能爆单，建议由店长手动考虑暂停接单（≤0 关闭该级）
  overload-orders: ${FORECAST_OVERLOAD_ORDERS:8}
# 演示沙盘（T74，F11）：一键造当日数据，供 AC-15 统计口径核对与 AC-05 超时关闭当场演示。
# **真店部署必须置为 false**（或直接删掉本段）——置 false 时整个 /api/admin/demo/** 端点
# 不会被注册、URL 返回 404，而不是「进去了才被拒」。
demo:
  seed:
    enabled: ${DEMO_SEED_ENABLED:true}
# AI 点单（T29）：三件套全配置化，换豆包等 OpenAI 兼容模型只改此处，代码零改动（LLD 6.2）
ai:
  # GLM 的 OpenAI 兼容端点（LLD 6.2）
  base-url: https://open.bigmodel.cn/api/paas/v4
  # 密钥一律走 backend/.env 或环境变量 AI_API_KEY，不入库不入前端；缺省时 AI 点单功能不可用
  api-key: "${AI_API_KEY:}"
  model: glm-4-flash
  temperature: 0.2
  # 单次响应超时（秒）：SRS 5.5「模型单次响应超过 10 秒视为超时」
  # 注：LLD 6.2 写作 20 秒，与 SRS 5.5 冲突，本任务按需求基线取 10（见 docs/T29-AI基础设施实施方案.md 冲突 C4）
  timeout-seconds: 10
  # 记忆窗口消息数：20 条 ≈ 10 轮问答（T29 卡 / HLD「10 轮记忆」）
  max-messages: 20
  # 会话无活动过期时长（分钟）：LLD 6.5 / HLD
  session-timeout-minutes: 30
  # 按顾客限流（T31，LLD 9.2「chat 接口按顾客维度限流 10 次/分钟，内存滑动窗口」）：
  # 超出返回 code=1009，保护免费档模型额度（HLD 风险 R2）。流式与非流式共用同一份额度。
  rate-limit-per-minute: 10
  # 流式对话（POST /api/customer/ai/chat/stream，SSE）
  stream:
    # 整体超时（秒）：决策 + 表述两条分支加起来必须在此预算内给出结论并关闭连接。
    # 看门狗保证「无论中间哪一跳卡住」，这一轮都一定在预算内收尾。
    timeout-seconds: ${AI_STREAM_TIMEOUT_SECONDS:20}
    # 首字闸门（毫秒）：推 decision/card 之前，等承接话术的首个增量最多这么久。
    # 作用是保证「先出文字、后出卡」的观感；旁白结束或失败即放行，不会真的等满。
    first-delta-gate-millis: ${AI_STREAM_FIRST_DELTA_GATE_MS:2000}
    # 编排线程池大小：一轮对话同时占用两个线程（旁白 + 决策），故它是「并发轮数」的两倍。
    # 上限 64 保护机器，单店场景默认 8 足够。
    pool-size: ${AI_STREAM_POOL_SIZE:8}
    # 等待队列容量（有界）：满了直接拒绝并发 error 事件，而不是让请求排到连接超时。
    # 一轮对话可能等满 timeout-seconds，故队列不宜过大（默认 32 约等于 16 轮排队）。
    queue-capacity: ${AI_STREAM_QUEUE_CAPACITY:32}
# Jev 决策层（TypeSafe AI 的 System One 模型）：定位是「决策层」而非「表述层」——
# 它不产出自然语言、也不调用工具，只回答选择题（选哪杯/杯型/温度/甜度/加料/几杯），
# 并给出校准置信度；话术生成与草稿编排仍由上面的 GLM 链路承担（分层而不替换）。
# 与 ai.* 完全分离：两条链路可各自开关、各自配超时，谁挂了都不牵连对方。
jev:
  # 总开关（默认开，与 forecast.enabled 同风格）。注意真正发起请求还要求 api-key 非空，
  # 因此没配密钥的环境不会白发一次 401——「关了」与「开着但没配全」在日志里可区分。
  enabled: ${JEV_ENABLED:true}
  base-url: ${JEV_BASE_URL:https://api.typesafe.ai}
  # 密钥一律走 backend/.env 或环境变量 TYPESAFE_API_KEY，不入库不入前端
  api-key: "${TYPESAFE_API_KEY:}"
  # 官方唯一决策端点（所有 System One 模型共用，靠 body.model 路由）
  path: /v1/systemone
  # 钉版本号而非 jev-latest 别名：置信度阈值是针对具体版本调出来的，别名漂移会让阈值一夜失效
  model: ${JEV_MODEL:jev-1.13.0}
  # 连接超时（秒）
  connect-timeout-seconds: 3
  # 单次读超时（秒）：跨境外部依赖，宁可快速降级也不能让顾客盯着转圈
  timeout-seconds: 8
  # state 预算（估算口径，CJK 每字≈1 token、其余每 4 字符≈1 token）。
  # 官方硬限为「state + 最长单问 ≤ 32k tokens」，此处留足余量；超出按菜单序截断尾部商品并告警。
  max-state-tokens: 6000
  # 置信度阈值：达到才程序化落草稿；低于它转 GLM 链路澄清（宁可多问一句，不可猜错下单）
  confidence-threshold: 0.72
  # 429/529/网络超时的退避重试（官方建议 1s→2s→4s 加 jitter）；
  # 401/422 一律不重试（官方明确要求）
  retry-max-attempts: 3
  retry-base-millis: 1000
  # 连续失败达该次数即熔断；冷却期内本地短路，不发起任何网络请求（含半开探测失败即重新熔断）
  circuit-failure-threshold: 5
  circuit-open-seconds: 60
# 长期口味偏好（不进对话热路径的「记忆」实现）
# 数据来源只有一条：已成交订单（PAID/PREPARING/COMPLETED）的规格快照，不解析对话内容。
# 刷新有两个触发点：订单事件异步刷新 + 读取时的惰性补算（超过 stale-hours 才重算）。
preference:
  # 认定所需的最少订单数（分母按订单数、不按杯数）；低于它宁可不认定（防「一单定终身」）
  min-sample-orders: 3
  # 认定所需的频次占比：选项出现次数 / 组内订单数 ≥ 该值才认定。
  # 单选组的占比天然互斥，故 0.6 时最多命中一项；多选组可能命中多项。
  mode-ratio: 0.6
  # 参与聚合的最近订单数上限（口味会变，远古订单不该绑架今天的选择）
  window-orders: 50
  # 惰性补算的过期时长（小时）：超过它才重算，避免每次进页面都扫两遍表
  stale-hours: 24
